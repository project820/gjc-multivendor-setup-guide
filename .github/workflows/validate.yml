name: validate-profiles
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Validate profile invariants (no credentials needed)
        run: python3 scripts/validate-profiles.py
      - name: Validator fail-closed fixtures
        run: bash scripts/ci-fixture-check.sh
      - name: README required_providers parity
        run: python3 scripts/check-provider-parity.py
      - name: Funnel matrix parity (4 READMEs)
        run: python3 scripts/check-funnel-parity.py
      - name: Link integrity (files + GitHub anchors)
        run: python3 scripts/slug-anchor-check.py --all
      - name: Link gate fail-closed fixtures
        run: python3 scripts/check-link-fixtures.py
      - name: factsheet §2 parity
        run: python3 scripts/check-factsheet-parity.py
